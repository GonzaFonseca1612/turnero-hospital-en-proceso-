<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indalo</title>
    <style>
        *{
    transition: all 0.6s;
}

html {
    height: 100%;
}

body{
    font-family: 'Lato', sans-serif;
    color: black;
    margin: 0;
}

#main{
    display: table;
    width: 100%;
    height: 100vh;
    text-align: center;
}

.fof{
	  display: table-cell;
	  vertical-align: middle;
}

.fof h1{
	  font-size: 50px;
	  display: inline-block;
	  padding-right: 12px;
	  animation: type .5s alternate infinite;
}
.fof p{
	  font-size: 25px;
	  padding-right: 12px;
	  animation: type .5s alternate infinite;
}
.fof #red{
	  font-size: 20px;
	  padding-right: 12px;
	  animation: type .5s alternate infinite;
}
@keyframes type{
	  from{box-shadow: inset -3px 0px 0px black;}
	  to{box-shadow: inset -3px 0px 0px transparent;}
}
    </style>
</head>
<body>
    <div id="main">
    	<div class="fof">
        		<h1>Turno reservado</h1>
                <p>Le enviamos la informacion del turno a su correo electronico</p>
                <p id="red">Sera redireccionado en 5 segundos</p>
    	</div>
        <script>
            function r() {
                location.href="turnero.php";
            }
            setTimeout("r()",5000);
        </script>
</div>
</body>
</html>
